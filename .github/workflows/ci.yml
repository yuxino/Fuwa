name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-checksum:
    name: Release checksum parser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Parse and test release checksum verifier
        shell: bash
        run: |
          bash -n scripts/verify-release-checksum.sh
          bash -n scripts/test-verify-release-checksum.sh
          bash scripts/test-verify-release-checksum.sh
          python3 -m py_compile \
            scripts/update-metadata.py \
            scripts/test-update-metadata.py
          python3 scripts/test-update-metadata.py
          python3 scripts/test-macos-only.py
          python3 scripts/test-dmg-layout.py

  swift:
    name: Strict build and logic tests
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift toolchain
        run: swift --version

      - name: Build Fuwa in Release mode
        run: >-
          swift build --configuration release --product Fuwa
          -Xswiftc -Osize
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors

      - name: Run logic tests in Release mode
        run: >-
          swift run --configuration release
          -Xswiftc -Osize
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors
          FuwaLogicTests

      - name: Run native termination tests
        run: >-
          swift test
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors

      - name: Verify app icon assets
        run: ./scripts/generate-app-icon.sh --check

      - name: Check macOS scripts and signing guard
        run: |
          for script in scripts/*.sh; do
            case "$(head -n 1 "$script")" in
              '#!/bin/zsh') zsh -n "$script" ;;
              '#!/usr/bin/env bash') bash -n "$script" ;;
              *)
                echo "Unknown shell for $script" >&2
                exit 1
                ;;
            esac
          done
          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path

          ast.parse(
              Path("scripts/verify-macos-signature-pin.py").read_text(encoding="utf-8")
          )
          pins = json.loads(
              Path("scripts/release-signing-pins.json").read_text(encoding="utf-8")
          )
          if pins.get("schemaVersion") != 1:
              raise SystemExit("unsupported release signing pin schema")
          PY
          if FUWA_CODESIGN_IDENTITY=- scripts/codesign-identity.sh; then
            echo "ad-hoc signing was accepted" >&2
            exit 1
          fi
          if FUWA_BUILD_UNIVERSAL=unexpected scripts/package-app.sh; then
            echo "an invalid universal-build mode was accepted" >&2
            exit 1
          fi
          if grep -R 'FUWA_ALLOW_AD_HOC_SIGNING' scripts README.md README_EN.md README_ZH.md; then
            echo "an ad-hoc signing escape hatch was reintroduced" >&2
            exit 1
          fi
