name: Promote release draft

run-name: Promote ${{ inputs.tag }} draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing macOS-only release tag (must include the platform-scope change)
        required: true
        type: string
      macos_sha256:
        description: Accepted SHA-256 for the macOS zip
        required: true
        type: string
      confirmation:
        description: Exact risk acknowledgement shown by the validation step
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-promotion-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-macos:
    name: Verify stable-signed universal macOS asset
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      # GitHub hides draft Releases from tokens without push-level repository access.
      contents: write

    steps:
      - name: Check out the exact tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Check macOS-only release contract
        run: python3 scripts/test-macos-only.py

      - name: Verify the pinned macOS identity and universal archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          ACCEPTED_MACOS_SHA256: ${{ inputs.macos_sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be v followed by three numeric components." >&2
            exit 1
          fi
          if [[ ! "$ACCEPTED_MACOS_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Accepted macOS SHA-256 must contain 64 hexadecimal characters." >&2
            exit 1
          fi
          accepted_macos_sha256="$(
            printf '%s' "$ACCEPTED_MACOS_SHA256" | tr '[:upper:]' '[:lower:]'
          )"
          version="${RELEASE_TAG#v}"
          macos_zip="Fuwa-${version}.zip"
          pins="$GITHUB_WORKSPACE/scripts/release-signing-pins.json"

          release_json="$(
            gh api --method GET --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -cer --arg tag "$RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag and .draft == true)] |
                 if length == 1 then .[0]
                 else error("expected exactly one matching draft Release") end'
          )"
          if [[ "$(jq -r '.draft' <<<"$release_json")" != "true" ]]; then
            echo "The target Release does not exist as a draft." >&2
            exit 1
          fi

          asset_dir="$(mktemp -d "$RUNNER_TEMP/fuwa-macos-release-assets.XXXXXX")"
          for asset_name in "$macos_zip" "${macos_zip}.sha256"; do
            asset_id="$(
              jq -er --arg name "$asset_name" \
                '[.assets[] | select(.name == $name)] |
                 if length == 1 then .[0].id
                 else error("expected exactly one matching release asset") end' \
                <<<"$release_json"
            )"
            gh api --method GET \
              -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "$asset_dir/$asset_name"
          done
          cd "$asset_dir"

          if [[ ! -f "$macos_zip" || ! -f "${macos_zip}.sha256" ]]; then
            echo "The macOS package and checksum must both be present." >&2
            exit 1
          fi
          line_count="$(
            awk 'NF { count += 1 } END { print count + 0 }' "${macos_zip}.sha256"
          )"
          if [[ "$line_count" != "1" ]]; then
            echo "${macos_zip}.sha256 must contain exactly one checksum record." >&2
            exit 1
          fi
          read -r recorded_hash recorded_name < "${macos_zip}.sha256"
          recorded_hash="$(printf '%s' "$recorded_hash" | tr '[:upper:]' '[:lower:]')"
          recorded_name="${recorded_name#\*}"
          actual_hash="$(shasum -a 256 "$macos_zip" | awk '{ print tolower($1) }')"
          if [[ "$recorded_hash" != "$accepted_macos_sha256" \
              || "$recorded_name" != "$macos_zip" \
              || "$actual_hash" != "$accepted_macos_sha256" ]]; then
            echo "The macOS archive does not match its accepted SHA-256." >&2
            exit 1
          fi

          while IFS= read -r archive_entry; do
            case "$archive_entry" in
              /*|../*|*/../*|*/..)
                echo "The macOS archive contains an unsafe path: $archive_entry" >&2
                exit 1
                ;;
            esac
          done < <(/usr/bin/unzip -Z1 "$macos_zip")

          unpack_dir="$(mktemp -d "$RUNNER_TEMP/fuwa-macos-unpacked.XXXXXX")"
          /usr/bin/ditto -x -k "$macos_zip" "$unpack_dir"
          top_level_count="$(
            find "$unpack_dir" -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' '
          )"
          app="$unpack_dir/Fuwa.app"
          binary="$app/Contents/MacOS/Fuwa"
          if [[ "$top_level_count" != "1" || ! -d "$app" || ! -f "$binary" ]]; then
            echo "The archive must contain exactly one top-level Fuwa.app bundle." >&2
            exit 1
          fi

          bundle_identifier="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
              "$app/Contents/Info.plist"
          )"
          bundle_version="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              "$app/Contents/Info.plist"
          )"
          if [[ "$bundle_identifier" != "app.yuxino.fuwa" \
              || "$bundle_version" != "$version" ]]; then
            echo "The macOS bundle identifier or public version is unexpected." >&2
            exit 1
          fi

          /usr/bin/lipo "$binary" -verify_arch arm64 x86_64
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"

          certificate_dir="$(
            mktemp -d "$RUNNER_TEMP/fuwa-release-certificate.XXXXXX"
          )"
          certificate_prefix="$certificate_dir/fuwa-certificate"
          /usr/bin/codesign --display \
            --extract-certificates="$certificate_prefix" "$app"
          if [[ ! -f "${certificate_prefix}0" ]]; then
            echo "codesign did not extract a leaf signing certificate." >&2
            exit 1
          fi
          expected_leaf_sha1="$(
            jq -er '.identity.leafCertificateSha1 |
              select(test("^[0-9a-f]{40}$"))' "$pins"
          )"
          expected_leaf_sha256="$(
            jq -er '.identity.leafCertificateSha256 |
              select(test("^[0-9a-f]{64}$"))' "$pins"
          )"
          actual_leaf_sha1="$(
            shasum -a 1 "${certificate_prefix}0" | awk '{ print tolower($1) }'
          )"
          actual_leaf_sha256="$(
            shasum -a 256 "${certificate_prefix}0" | awk '{ print tolower($1) }'
          )"
          if [[ "$actual_leaf_sha1" != "$expected_leaf_sha1" \
              || "$actual_leaf_sha256" != "$expected_leaf_sha256" ]]; then
            echo "The macOS leaf signing certificate does not match the stable pin." >&2
            exit 1
          fi

          /usr/bin/codesign --display --requirements - "$app" 2>&1 \
            | tee "$RUNNER_TEMP/fuwa-designated-requirement.txt"
          if grep -qi 'cdhash' "$RUNNER_TEMP/fuwa-designated-requirement.txt"; then
            echo "The stable designated requirement must not contain cdhash." >&2
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/scripts/verify-macos-signature-pin.py" \
            --binary "$binary" \
            --pins "$pins"

  prepare-update-metadata:
    name: Sign macOS update and prepare feed
    needs: verify-macos
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out the exact tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Generate, verify, and upload signed updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          UPDATER_PRIVATE_KEY: ${{ secrets.FUWA_UPDATER_ED25519_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$UPDATER_PRIVATE_KEY" ]]; then
            echo "FUWA_UPDATER_ED25519_PRIVATE_KEY is not configured." >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          read -r plist_version build_number < <(
            python3 - <<'PY'
          import plistlib
          with open("Resources/Info.plist", "rb") as stream:
              metadata = plistlib.load(stream)
          print(metadata["CFBundleShortVersionString"], metadata["CFBundleVersion"])
          PY
          )
          if [[ "$version" != "$plist_version" ]]; then
            echo "Tag and bundle versions differ." >&2
            exit 1
          fi

          release_json="$(
            gh api --method GET --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -cer --arg tag "$RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag and .draft == true)] |
                 if length == 1 then .[0]
                 else error("expected exactly one matching draft Release") end'
          )"
          asset_dir="$(mktemp -d "$RUNNER_TEMP/fuwa-update-assets.XXXXXX")"
          metadata_dir="$(mktemp -d "$RUNNER_TEMP/fuwa-update-metadata.XXXXXX")"
          macos_zip="Fuwa-${version}.zip"
          base_assets=(
            "$macos_zip"
            "${macos_zip}.sha256"
          )
          expected_base_file="$RUNNER_TEMP/fuwa-expected-base-assets.txt"
          actual_base_file="$RUNNER_TEMP/fuwa-actual-base-assets.txt"
          printf '%s\n' "${base_assets[@]}" | sort > "$expected_base_file"
          jq -r '.assets[].name' <<<"$release_json" | sort > "$actual_base_file"
          if ! diff -u "$expected_base_file" "$actual_base_file"; then
            echo "Updater signing requires the exact two-file macOS draft." >&2
            exit 1
          fi
          for asset_name in "$macos_zip"; do
            asset_id="$(
              jq -er --arg name "$asset_name" \
                '[.assets[] | select(.name == $name)] |
                 if length == 1 then .[0].id
                 else error("expected exactly one matching release asset") end' \
                <<<"$release_json"
            )"
            gh api --method GET \
              -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "$asset_dir/$asset_name"
          done

          sparkle_zip="$RUNNER_TEMP/Sparkle-for-Swift-Package-Manager-2.9.6.zip"
          curl --fail --location --silent --show-error \
            -o "$sparkle_zip" \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-for-Swift-Package-Manager.zip"
          printf '%s  %s\n' \
            '8d5fb41d960b43f4a68aa14126bf62b098544ec8d191cdcc73eb14e63a8e7606' \
            "$sparkle_zip" | shasum -a 256 -c -
          sparkle_dir="$(mktemp -d "$RUNNER_TEMP/fuwa-sparkle-tools.XXXXXX")"
          ditto -x -k "$sparkle_zip" "$sparkle_dir"
          sign_update="$sparkle_dir/bin/sign_update"

          detached_index=0
          sign_detached() {
            local file="$1"
            local signing_copy="$RUNNER_TEMP/fuwa-detached-${detached_index}.bin"
            detached_index=$((detached_index + 1))
            cp "$file" "$signing_copy"
            printf '%s' "$UPDATER_PRIVATE_KEY" \
              | "$sign_update" --ed-key-file - -p "$signing_copy" > "${file}.sig"
          }
          for asset_name in "$macos_zip"; do
            sign_detached "$asset_dir/$asset_name"
          done

          notes_file="$RUNNER_TEMP/fuwa-release-notes.txt"
          awk \
            -v heading="## [${version}]" \
            '$0 == heading || index($0, heading " - ") == 1 {capture=1; next}
             capture && /^## / {exit}
             capture && /^### (English|中文)$/ {sub(/^### /, "## "); print; next}
             capture {print}' \
            CHANGELOG.md > "$notes_file"
          if [[ ! -s "$notes_file" ]]; then
            echo "Current-version release notes are missing from CHANGELOG.md." >&2
            exit 1
          fi
          published_at="$(git show -s --format=%cD "${RELEASE_TAG}^{}")"
          python3 scripts/update-metadata.py generate \
            --version "$version" \
            --build "$build_number" \
            --published-at "$published_at" \
            --release-notes "$notes_file" \
            --asset-dir "$asset_dir" \
            --output-dir "$metadata_dir"

          feeds=(
            appcast.xml
          )
          for feed in "${feeds[@]}"; do
            printf '%s' "$UPDATER_PRIVATE_KEY" \
              | "$sign_update" --ed-key-file - \
                  "$metadata_dir/$feed" --disable-signing-warning
            sign_detached "$metadata_dir/$feed"
          done
          sign_detached "$metadata_dir/latest.json"

          python3 scripts/update-metadata.py verify \
            --asset-dir "$asset_dir" \
            --metadata-dir "$metadata_dir" \
            --require-signed-feeds
          public_key='8qWUhz/r6J3c6fVw9NVEmqvWcF4oVKwAtLFm9AkA1ZA='
          for asset_name in "$macos_zip"; do
            swift scripts/verify-ed25519-signature.swift \
              "$public_key" "$asset_dir/$asset_name" "$asset_dir/${asset_name}.sig"
          done
          for metadata_name in "${feeds[@]}" latest.json; do
            swift scripts/verify-ed25519-signature.swift \
              "$public_key" \
              "$metadata_dir/$metadata_name" \
              "$metadata_dir/${metadata_name}.sig"
          done
          altered_asset="$RUNNER_TEMP/fuwa-altered-update.bin"
          cp "$asset_dir/$macos_zip" "$altered_asset"
          printf '\0' >> "$altered_asset"
          if swift scripts/verify-ed25519-signature.swift \
              "$public_key" "$altered_asset" "$asset_dir/${macos_zip}.sig"; then
            echo "Signature verifier accepted an altered update payload." >&2
            exit 1
          fi

          upload_assets=(
            "$asset_dir/${macos_zip}.sig"
            "$metadata_dir/appcast.xml"
            "$metadata_dir/appcast.xml.sig"
            "$metadata_dir/latest.json"
            "$metadata_dir/latest.json.sig"
          )
          gh release upload "$RELEASE_TAG" "${upload_assets[@]}" --clobber

  promote:
    name: Verify exact assets and publish draft
    needs: [verify-macos, prepare-update-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-promotion
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the exact tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify draft and accepted bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          ACCEPTED_MACOS_SHA256: ${{ inputs.macos_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be v followed by three numeric components." >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          expected_confirmation="publish Fuwa ${RELEASE_TAG} with unnotarized macOS assets"
          if [[ "$CONFIRMATION" != "$expected_confirmation" ]]; then
            echo "Confirmation must be exactly: $expected_confirmation" >&2
            exit 1
          fi
          for accepted_hash in \
            "$ACCEPTED_MACOS_SHA256"; do
            if [[ ! "$accepted_hash" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "Every accepted SHA-256 must contain exactly 64 hexadecimal characters." >&2
              exit 1
            fi
          done

          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$(git rev-parse HEAD)" != "$tag_commit" ]]; then
            echo "Checkout does not resolve to the requested tag commit." >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag commit is not contained in origin/main." >&2
            exit 1
          fi

          read -r plist_version build_number < <(
            python3 - <<'PY'
          import plistlib
          with open("Resources/Info.plist", "rb") as stream:
              metadata = plistlib.load(stream)
          print(metadata["CFBundleShortVersionString"], metadata["CFBundleVersion"])
          PY
          )
          if [[ "$plist_version" != "$version" ]]; then
            echo "Tag version $version differs from Info.plist version $plist_version." >&2
            exit 1
          fi

          successful_runs="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f event=push \
              -f status=success \
              -f per_page=100
          )"
          tag_run_id="$(
            jq -er --arg commit "$tag_commit" --arg tag "$RELEASE_TAG" \
              '[.workflow_runs[] |
                select(
                  .head_sha == $commit and
                  .head_branch == $tag and
                  .conclusion == "success"
                )] |
               sort_by(.run_attempt, .id) |
               last.id' \
              <<<"$successful_runs"
          )" || {
            echo "No successful tag CI run was found for the release commit." >&2
            exit 1
          }
          echo "Verified successful tag CI run: $tag_run_id"

          release_json="$(
            gh api --method GET --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -cer --arg tag "$RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag and .draft == true)] |
                 if length == 1 then .[0]
                 else error("expected exactly one matching draft Release") end'
          )"
          if [[ "$(jq -r '.draft' <<<"$release_json")" != "true" ]]; then
            echo "The target Release does not exist as a draft." >&2
            exit 1
          fi
          if [[ "$(jq -r '.prerelease' <<<"$release_json")" != "false" ]]; then
            echo "Stable promotion refuses a prerelease draft." >&2
            exit 1
          fi
          release_id="$(jq -r '.id' <<<"$release_json")"

          macos_zip="Fuwa-${version}.zip"
          expected_assets=(
            "$macos_zip"
            "${macos_zip}.sha256"
            "${macos_zip}.sig"
            "appcast.xml"
            "appcast.xml.sig"
            "latest.json"
            "latest.json.sig"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected_assets[@]}" | sort)
          mapfile -t actual_sorted < <(jq -r '.assets[].name' <<<"$release_json" | sort)
          if ! diff -u \
            <(printf '%s\n' "${expected_sorted[@]}") \
            <(printf '%s\n' "${actual_sorted[@]}"); then
            echo "Draft assets do not match the exact seven-file macOS release contract." >&2
            exit 1
          fi
          asset_snapshot="$(
            jq -c '[.assets[] | {id, name, size, updated_at, digest}] | sort_by(.name)' \
              <<<"$release_json"
          )"

          asset_dir="$(mktemp -d "$RUNNER_TEMP/fuwa-release-assets.XXXXXX")"
          for asset_name in "${expected_assets[@]}"; do
            asset_id="$(
              jq -er --arg name "$asset_name" \
                '[.assets[] | select(.name == $name)] |
                 if length == 1 then .[0].id
                 else error("expected exactly one matching release asset") end' \
                <<<"$release_json"
            )"
            gh api --method GET \
              -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              > "$asset_dir/$asset_name"
          done
          cd "$asset_dir"

          verify_package() {
            local package_name="$1"
            local accepted_hash="${2,,}"
            local checksum_name="${package_name}.sha256"

            bash "$GITHUB_WORKSPACE/scripts/verify-release-checksum.sh" \
              "$package_name" "$checksum_name" "$accepted_hash"
          }

          verify_package "$macos_zip" "$ACCEPTED_MACOS_SHA256"

          python3 "$GITHUB_WORKSPACE/scripts/update-metadata.py" verify \
            --asset-dir "$asset_dir" \
            --metadata-dir "$asset_dir" \
            --require-signed-feeds

          final_draft_json="$(
            gh api --method GET --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -cer --argjson id "$release_id" \
                '[.[][] | select(.id == $id and .draft == true)] |
                 if length == 1 then .[0]
                 else error("verified draft Release is no longer available") end'
          )"
          final_draft_snapshot="$(
            jq -c '[.assets[] | {id, name, size, updated_at, digest}] | sort_by(.name)' \
              <<<"$final_draft_json"
          )"
          if [[ "$(jq -r '.draft' <<<"$final_draft_json")" != "true" ]]; then
            echo "Draft state changed during verification." >&2
            exit 1
          fi
          if [[ "$final_draft_snapshot" != "$asset_snapshot" ]]; then
            echo "Draft assets changed during verification." >&2
            exit 1
          fi
          published_json="$(
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F draft=false \
              -f make_latest=true
          )"
          if [[ "$(jq -r '.id' <<<"$published_json")" != "$release_id" \
              || "$(jq -r '.tag_name' <<<"$published_json")" != "$RELEASE_TAG" \
              || "$(jq -r '.draft' <<<"$published_json")" != "false" \
              || "$(jq -r '.prerelease' <<<"$published_json")" != "false" ]]; then
            echo "GitHub did not return the expected published stable Release." >&2
            exit 1
          fi

          post_publish_json="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          )"
          post_publish_snapshot="$(
            jq -c '[.assets[] | {id, name, size, updated_at, digest}] | sort_by(.name)' \
              <<<"$post_publish_json"
          )"
          if [[ "$(jq -r '.draft' <<<"$post_publish_json")" != "false" \
              || "$(jq -r '.prerelease' <<<"$post_publish_json")" != "false" \
              || "$(jq -r '.published_at != null' <<<"$post_publish_json")" != "true" \
              || "$post_publish_snapshot" != "$asset_snapshot" ]]; then
            echo "Published Release state or assets differ from the verified draft." >&2
            exit 1
          fi

          latest_json="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/releases/latest"
          )"
          if [[ "$(jq -r '.id' <<<"$latest_json")" != "$release_id" \
              || "$(jq -r '.tag_name' <<<"$latest_json")" != "$RELEASE_TAG" ]]; then
            echo "The promoted Release did not become the repository's latest Release." >&2
            exit 1
          fi
